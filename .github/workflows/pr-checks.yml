name: PR Checks

on:
  pull_request:
    branches: [master]

jobs:
  checks:
    name: Format, Lint, Astro Check, Test, Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Astro diagnostics
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Audit dependencies (high+ severity)
        run: npm audit --audit-level=high
